[project]
name = "motorsim"
version = "0.1.0"
description = "Motor-level drone simulator with averaged electrical dynamics"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "gymnasium>=0.29",
    "stable-baselines3>=2.0",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["motorsim*"]
